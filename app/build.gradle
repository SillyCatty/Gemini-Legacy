apply plugin: 'com.android.application'

android {
    compileSdkVersion 28

    defaultConfig {
        applicationId "com.example.geminilegacy"
        minSdkVersion 14
        targetSdkVersion 28
        versionCode 11
        versionName "0.5.0-alpha"

        // Conscrypt ships native libraries; keep only the CPU types real phones use.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // DrawerLayout for the swipe-in chat menu. 28.0.0 is the last Support Library and still supports API 14.
    implementation 'com.android.support:support-v4:28.0.0'
    // Reads the camera's rotation flag so portrait photos are not sent sideways.
    implementation 'com.android.support:exifinterface:28.0.0'

    // Modern TLS 1.2/1.3 (incl. AES-GCM) for Android 4.x, whose built-in TLS cannot talk to GitHub.
    implementation 'org.conscrypt:conscrypt-android:2.5.2'

    // Last OkHttp line that supports Android 4.0 (API 14).
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
}
